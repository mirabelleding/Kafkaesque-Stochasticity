[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "Kafkaesque-Stochasticity"
version = "0.1.0"
description = "A stochastic framework for modelling and forecasting Kafkaesque occurrences."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "MI77-LAB" }
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2,<4",
    "polars>=1,<3",
    "pyarrow>=15.0,<27.0",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/mirabelleding/Kafkaesque-Stochasticity"

[tool.setuptools.packages.find]
where = ["."]
include = ["kafkaesque_stochasticity*"]